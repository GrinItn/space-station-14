- type: entity
  id: HandheldBlueShieldMonitor
  parent: HandheldCrewMonitor
  name: handheld Blue Shield monitor
  description: A handheld crew monitor, hardware-locked to track the vitals of the station's command staff and unidentified individuals without ID-cards.
  components:
  - type: BlueShieldMonitor
  - type: Sprite
    sprite: SS220/Objects/Devices/blue_shield_monitor.rsi
    layers:
    - state: scanner
    - state: scanner_glow
      shader: unshaded
  - type: ActivatableUI
    key: enum.CrewMonitoringUIKey.Key
  - type: UserInterface
    interfaces:
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: Item
    heldPrefix: scanner
    storedRotation: 270
  - type: PowerCellDraw
    drawRate: 1
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh
